InputFilterWorkerNum: 10
LogLevel: "trace"
ManageHTTPSServer: ":19520"
InputBufferConfig:
  Name: "input_common"
  Size: 100
Inputs:
  - Name: "file"
    ID: "input_file_1"
    Path: "/var/tmp/hoge"
Filters:
  - Name: "matcher"
    ID: "filter_matcher_1"
    Rule:
      Op: "AND"
      Matchers:
        - Type: "DNS"
          Name: "qname"
          Arg: "www.example.jp"
OutputGroups:
  - Filters:
      - Name: "matcher"
        ID: "og1_filter_matcher_1"
        Rule:
          op: "AND"
          Matchers:
            - Type: "DNS"
              Name: "qtype"
              Arg: "A"
    Outputs:
      - Name: "nop"
        ID: "og1_nop_1"
